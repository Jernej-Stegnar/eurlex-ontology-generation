# SEED gold set for typing / class-vs-individual evaluation.
#
# Written to bootstrap the evaluation harness; it is NOT an expert annotation.
# Replace or extend it with entries checked by a legal-ontology expert, sampled
# from the documents actually processed (aim for 100+ entities spread across
# act types and years). Entries that also appear in the gazetteer only test that
# the gazetteer is applied; the entries marked `# not in gazetteer` test the
# generator and the keyword typer.
#
# Fields: name (+ optional aliases), type (Party | Asset | Legal_extension),
# is_a (upper ontology class), kind (class | individual).

# Every entry below is a seed label (source: seed). The evaluation reports
# them only as a smoke test and never as accuracy. Independent labels come
# from blind annotation sheets (scripts/make_annotation_sheet.py) or entries
# marked `source: expert`.
source: seed

entities:
  # individuals known to the gazetteer
  - {name: European_Commission, type: Party, is_a: EUInstitution, kind: individual}
  - {name: Council, type: Party, is_a: EUInstitution, kind: individual}
  - {name: European_Parliament, type: Party, is_a: EUInstitution, kind: individual}
  - {name: Latvia, type: Party, is_a: Country, kind: individual}
  - {name: Cyprus, type: Party, is_a: Country, kind: individual}
  - {name: Greece, type: Party, is_a: Country, kind: individual}
  - {name: United_Kingdom, type: Party, is_a: Country, kind: individual}
  - {name: IMF, type: Party, is_a: InternationalOrganisation, kind: individual}
  - {name: EGF, type: Asset, is_a: Fund, kind: individual}
  - {name: European_Union_Solidarity_Fund, aliases: [SolidarityFund], type: Asset, is_a: Fund, kind: individual}
