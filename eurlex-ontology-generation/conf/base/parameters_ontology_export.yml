# Parameters for pipeline 'ontology_export' (runs after ontology_refinement).
#
# Exports the refined ontology as OWL 2 + ODRL 2.2 Turtle and validates it with
# the SHACL shapes in src/eurlex_ontology_generation/resources/shapes.ttl.
# Run with:  uv run kedro run --pipelines ontology_export

ontology_export:
  # input: the catalog dataset `refined_ontology`
  turtle_path: data/07_model_output/eurlex_odrl_ontology.ttl
  shacl_report_path: data/08_reporting/shacl_report.ttl
  summary_path: data/08_reporting/ontology_export_summary.json
  # Persistent namespace for the project's IRIs (w3id.org). The redirect rules
  # live in publish/w3id/eurlex-odrl/ and must be submitted as a pull request
  # to https://github.com/perma-id/w3id.org before the IRIs resolve.
  base_iri: "https://w3id.org/eurlex-odrl/"
  shapes_path: null          # null = packaged resources/shapes.ttl
  vocabulary_path: null
  # true: the pipeline fails when SHACL reports any sh:Violation (use in CI).
  # Warnings and infos never fail the run.
  fail_on_violation: true
  # OWL 2 consistency check with HermiT (owlready2 + Java). Skipped, and
  # reported as unavailable, when either is missing.
  run_reasoner: true
  # Titles and dates for the per-act ODRL policies, from the cleaned corpus
  # written by eurlex_ingestion (CELEX, Act_name, Date_document). Optional:
  # without it each act policy still gets CELEX, act type, year and links.
  act_metadata_path: data/02_intermediate/eurlex_corpus.csv
