# This is a boilerplate parameters config generated for pipeline 'ontology_merge_partition'
# using Kedro 1.4.0.
#
# Documentation for this file format can be found in "Parameters"
# Link: https://docs.kedro.org/en/1.4.0/configuration/parameters.html

ontology_merge_partition:
  part_id: 0
  revisions_directory: data/04_feature/ontology_revisions
  # Latest review verdict per chunk is joined in, so every merged class and
  # rule reports support.approved_chunks next to support.chunks.
  reviews_directory: data/04_feature/ontology_reviews
  # true: merge only chunks whose revision was approved by a re-review.
  exclude_unapproved: false
  output_directory: data/05_model_input/ontology_merges_partition
  provenance_directory: data/05_model_input/ontology_merges_partition_provenance
  cluster_report_directory: data/05_model_input/ontology_merges_partition_cluster_reports
 
  # Embedding model pulled via Ollama (e.g. `ollama pull all-minilm`).
  # all-minilm is small/fast
  embedding_model: all-minilm
  # Backend profile from conf/base/globals.yml (ollama or openai_compatible).
  embedding_backend: ${globals:llm_backends.local}
 
  # Cosine similarity threshold for merging two entity mentions into the
  # same canonical entity. Start here and tune after inspecting a
  # cluster_report: too low -> unrelated concepts get merged together;
  # too high -> obvious duplicates (e.g. "Commission" vs "European
  # Commission") stay separate.
  similarity_threshold: 0.86