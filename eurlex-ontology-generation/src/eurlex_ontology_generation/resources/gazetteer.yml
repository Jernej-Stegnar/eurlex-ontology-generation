# Seed gazetteer of named EU-law entities.
#
# Every entry is an INDIVIDUAL (a single real-world referent), never a class.
# The refinement step and the review checks use it to:
#   - fix the type and is_a of known entities deterministically
#   - turn classes such as "Latvia" or "EGF" into individuals
#   - force-merge aliases ("Moldova" == "Republic_of_Moldova")
#
# iri: only EU Vocabularies country IRIs are filled in, because they are
# derived mechanically from ISO 3166-1 alpha-3 codes
# (http://publications.europa.eu/resource/authority/country/<ISO3>).
# Corporate-body IRIs and Wikidata QIDs are left empty on purpose: fill them
# from the authority tables, or let the optional Wikidata linker in the
# refinement pipeline add them (it caches what it finds).
#
# This list is a seed, not a complete register. Extend it as new documents
# are processed; the refinement report lists frequent unlinked names.

country_iri_prefix: "http://publications.europa.eu/resource/authority/country/"

countries:
