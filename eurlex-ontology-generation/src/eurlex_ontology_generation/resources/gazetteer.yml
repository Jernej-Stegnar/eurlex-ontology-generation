# Seed gazetteer of named EU-law entities.
#
# Every entry is an INDIVIDUAL (a single real-world referent), never a class.
# The refinement step and the review checks use it to:
#   - fix the type and is_a of known entities deterministically
#   - turn classes such as "Latvia" or "EGF" into individuals
#   - force-merge aliases ("Moldova" == "Republic_of_Moldova")
#
# Identifiers
#   iri       EU Vocabularies authority IRI. Countries: derived from ISO 3166-1
#             alpha-3 (http://publications.europa.eu/resource/authority/country/<ISO3>).
#             Corporate bodies: only the Commission (COM) is confirmed; fill the
#             rest with scripts/link_identifiers.py --corporate-body-rdf <file>.
#   wikidata  Wikidata QID. Collected on 2026-10-07 from web search results whose
#             page title exactly matched the entity's English label; ambiguous
#             cases carry a wikidata_note. Verify (label + P31 type) with
#             scripts/link_identifiers.py --verify on a machine with internet access.
#
# This list is a seed, not a complete register. Extend it as new documents
# are processed; the refinement report lists frequent unlinked names.

